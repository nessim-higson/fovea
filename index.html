<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IAAH — I Am Always Hungry</title>
<meta name="description" content="IAAH is an independent design studio focused on branding, visual identity, creative direction, print, title sequences, animation and interactive.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/site.css?v=49">
</head>
<body>

<canvas id="gl"></canvas>
<div id="spacer"></div>

<div class="overlay">
  <button class="metro" id="metro" aria-label="About IAAH"><i class="sq" id="metro-sq"></i><span id="metro-label"></span></button>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="detail" id="detail" hidden>
    <span class="detail-meta" id="detail-meta"></span>
    <p class="detail-desc" id="detail-desc"></p>
  </div>

  <button class="lens-btn" id="lens-btn" hidden>Lens: on</button>
  <div class="top">
    <button class="nav detail-x" id="detail-x" aria-label="Close project">&#215;</button>
    <button class="nav index-btn" id="works-btn">Works</button>
    <button class="nav sound-btn" id="sound-btn">Sound</button>
  </div>
  <button class="nav view-btn" id="view-btn" hidden></button>
  <div class="hint" hidden>G — effects panel</div>
  <div class="version" id="version" hidden>V.49</div>
  <div class="beat-dot" id="beat-dot" aria-hidden="true" hidden></div>
</div>

<div class="works-bed" id="works-bed" hidden></div>

<!-- the opening runs at once, before the modules land -->
<script src="js/intro.js?v=49"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "lil-gui": "https://esm.sh/lil-gui@0.19.2"
  }
}
</script>
<script type="module" src="js/app.js?v=49"></script>
</body>
</html>
